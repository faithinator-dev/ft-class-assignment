<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Clone - Bootstrap</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <!-- Desktop Area: Icons arranged in vertical columns -->
    <div class="desktop-area">
        
        <!-- Desktop Icon -->
        <div class="desktop-icon">
            <img src="images/recycle-bin.png" alt="Recycle Bin">
            <span>Recycle Bin</span>
        </div>

        <div class="desktop-icon">
            <img src="images/edge.png" alt="Microsoft Edge">
            <span>Microsoft Edge</span>
        </div>

        <div class="desktop-icon">
            <img src="images/vlc.png" alt="VLC">
            <span>VLC media player</span>
        </div>

        <div class="desktop-icon">
            <img src="images/bluestacks.png" alt="BlueStacks">
            <span>BlueStacks 5</span>
        </div>

        <div class="desktop-icon">
            <img src="images/folder-zip.png" alt="Zip">
            <span>zip</span>
        </div>

        <div class="desktop-icon">
            <img src="images/folder-zip.png" alt="Zip">
            <span>zip</span>
        </div>

        <div class="desktop-icon">
            <img src="images/folder-zip.png" alt="Zip">
            <span>zip</span>
        </div>

        <div class="desktop-icon">
            <img src="images/vscode.png" alt="VS Code">
            <span>Visual Studio Code</span>
        </div>

        <div class="desktop-icon">
            <img src="images/fiverr.png" alt="Fiverr">
            <span>Fiverr</span>
        </div>

        <div class="desktop-icon">
            <img src="images/game.png" alt="Game">
            <span>Killer Bean</span>
        </div>

        <div class="desktop-icon">
            <img src="images/notepad.png" alt="Notepad">
            <span>Notepad++</span>
        </div>

        <div class="desktop-icon">
            <img src="images/chrome.png" alt="Chrome">
            <span>Google Chrome</span>
        </div>

    </div>

    <!-- Taskbar at Bottom -->
    <div class="taskbar">
        
        <!-- Left Spacer -->
        <div class="spacer"></div>

        <!-- Center: App Icons -->
        <div class="taskbar-center">
            <button class="taskbar-btn" title="Start">
                <img src="images/windows-11.png" alt="Start">
            </button>
            <button class="taskbar-btn" title="Search">
                <img src="images/search.png" alt="Search">
            </button>
            <button class="taskbar-btn" title="Task View">
                <img src="images/task-view.png" alt="Task View">
            </button>
            <button class="taskbar-btn" title="File Explorer">
                <img src="images/folder-explorer.png" alt="Explorer">
            </button>
            <button class="taskbar-btn" title="Edge">
                <img src="images/edge-48.png" alt="Edge">
            </button>
            <button class="taskbar-btn" title="VS Code">
                <img src="images/vscode-48.png" alt="VS Code">
            </button>
            <button class="taskbar-btn" title="Store">
                <img src="images/store.png" alt="Store">
            </button>
        </div>

        <!-- Right: System Tray -->
        <div class="taskbar-right">
            <div class="tray-icons">
                <i class="bi bi-chevron-up"></i>
                <i class="bi bi-wifi"></i>
                <i class="bi bi-volume-up-fill"></i>
                <i class="bi bi-battery-half"></i>
            </div>
            <div class="clock">
                <div>7:10 PM</div>
                <div>1/5/2026</div>
            </div>
            <i class="bi bi-bell-fill"></i>
        </div>

    </div>

</body>
</html>
