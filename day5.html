
<!DOCTYPE html>
<html>
<head>
  <title>Ludo Board</title>
</head>
<body>
  <table border="1" cellspacing="0" cellpadding="5" style="border-collapse: collapse;" width="500px" height="500px">

    <!-- Start of board -->
    <!-- Row 1 -->
    <tr>
      <!-- Green Home -->
      <td colspan="6" rowspan="6" style="background-color: green;"></td>
      <!-- Top Path -->
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <!-- Yellow Home -->
      <td colspan="6" rowspan="6" style="background-color: yellow;"></td>
    </tr>

    <!-- Rows 2–6: Top path continues -->
    <tr>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
    </tr>
    <tr>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
    </tr>
    <tr>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
    </tr>
    <tr>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
    </tr>
    <tr>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
    </tr>

    <!-- Row 7: Horizontal path -->
    <tr>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <!-- Center row -->
      <td style="background-color: white;"></td>
      <td style="background-color: gold;"></td>
      <td style="background-color: white;"></td>
      <!-- Right path -->
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
    </tr>

    <!-- Row 8: Center row -->
    <tr>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: gold;"></td>
      <td style="background-color: gold;"></td>
      <td style="background-color: gold;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
    </tr>

    <!-- Row 9: Horizontal path -->
    <tr>
    <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: gold;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
    </tr>

    <!-- Rows 10–15: Bottom homes and bottom path -->
    <tr>
      <!-- Red Home -->
      <td colspan="6" rowspan="6" style="background-color: red;"></td>
      <!-- Bottom Path -->
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <!-- Blue Home -->
      <td colspan="6" rowspan="6" style="background-color: blue;"></td>
    </tr>
    <tr>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
    </tr>
    <tr>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
    </tr>
    <tr>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
    </tr>
    <tr>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
    </tr>
    <tr>
      <td style="background-color: lightgray;"></td>
      <td style="background-color: white;"></td>
      <td style="background-color: lightgray;"></td>
    </tr>
  </table>
</body>
</html>
