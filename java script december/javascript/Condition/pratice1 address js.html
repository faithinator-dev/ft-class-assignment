<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aroje</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body>
    <div class="col-lg-5 col-md-7 col-9 mx-auto p-lg-5 p-3 border-3 shadow mt-lg-5 mt-3">
        <h3 class="text-center">Address label</h3>
        <div id="errorMsg" style="display: none" class="alert alert-danger text-center p-2 fw-bold fs-6">
            input cannot be empty
        </div>
        <input class="form-control form-control-sm shadow-none my-2" type="text" name="" id="userAddress"
            placeholder="Enter your Address" />
        <button class="btn btn-outline-dark btn-sm w-100 my-3" onclick="addressProceed()">
            Proceed
        </button>
        <div id="successMsg"></div>
    </div>
</body>
<script>
    function addressProceed() {
        let userAdd = userAddress.value;
        if (userAdd == "") {
            errorMsg.style.display = "block";
        } else {
            errorMsg.style.display = "none";
            address = userAdd.toLowerCase();
            successMsg.innerHTML = `<div class="alert alert-dark p-2 fw-bold fs-6" id="successMsg">your address as been successfully added. Your address is ${address}</div>`;
            return address;
        }
    }
</script>

</html>
