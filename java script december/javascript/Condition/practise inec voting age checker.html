<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>
    <!-- security, all users are dumb. -->
     <div class="faith col-lg-5 col-md-7 col-9 mx-auto p-lg-5 p-3 border-3 shadow mt-lg-5 mt-3">
        <h3 class="text-center">INEC Vote Eligibility Checker</h3>
        <div id="errorMsg" style="display: none;" class="alert alert-danger text-center p-2 fw-bold fs-6">input cannot be empty</div>
         <input class="form-control form-control-sm shadow-none my-2" type="number" name="" id="userDate" placeholder="Enter your year of birth">
         <button class="btn btn-outline-dark btn-sm w-100 my-3" onfocus="checkEli()">Check Eligibility</button>
         <div id="successMsg"></div>
    </div>
'
</body>
<script>
    function checkEli() {
        if (userDate.value == ""){
            // alert("input cannot be empty");'
            errorMsg.style.display = 'block'

        } else {
            errorMsg.style.display = "none";
            console.log(userDate.value);
            const yearOfBirth = Number(userDate.value);
            const currentYear = new Date().getFullYear();
            const age = currentYear - yearOfBirth;
            console.log(age);
            if (age >= 18) {
                console.log("congrats, vote dey go,(You are eligible to vote)");
                successMsg.innerHTML = `<div class="alert alert-success p-2 fw-bold fs-6" id="successMsg">congrats, vote dey go,(You are eligible to vote)</div>`
                // successMsg.style.display = "block";
            } else {
                // alert("sorry you grow very fast, you are not eligible to vote");
                successMsg.innerHTML = `<div class="alert alert-dark p-2 fw-bold fs-6" id="successMsg" style="display: block;">you are not eligible to vote. sorry grow up fast. you have ${18 - age} </div>`

                // successMsg.style.display = "block";
            }
        }
    }
</script>
</html>
