<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAtric allocator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="text-center justify-content-center m-5 p-5">
    
    <div class="btn-info mx-auto border-1 border-success m-2 p-2 rounded-pill w-75">
        <h1 class="display-4 fs-2 text-success text-uppercase">Matric Allocator</h1>

        <p class="text-start text-capitalize">Enter First name:</p>
        <input type="text" class="form-control btn-outline-secondary " id="firstName" required><br>

        <p class="text-start text-capitalize">Enter middle name:</p>
        <input type="text" class="form-control btn-outline-secondary " id="middleName" ><br>

        <p class="text-start text-capitalize">Enter last name:</p>
        <input type="text" class="form-control btn-outline-secondary " id="lastName" required><br>
        <p>Select Department</p>

        <select id="departmentList" class="form-control p-2 rounded-pill" style="outline: 1px solid rgb(146, 144, 144); padding: 10px;" required>
            <option value="SES" id="Software Engineering">Software Engineering</option>
            <option value="GDS" id="graphicDesign">Graphic Designing</option>
            <option value="UIUXS" id="uiuxDesign">UI/UX Design</option>
            <option value="DS" id="dataScience">Data Science
            </option>
        </select> <br><br>

        <button class="btn m-2 btn-outline-success" onclick="generateMatric()">Allocate Matric</button>
        
        <div class="display mx-auto" id="display"></div>

        <div class="" id="tableList"></div>

    </div>
</body>
<script>
    // let matricNumbers = {
        // "SES": "SES2026/",
        // "GDS": "GDS2026/",
        // "UIUXS": "UIUX2026/",
        // "DS": "DS2026/"
    // };

    let firstNameInput = document.getElementById('firstName');
    let middleNameInput = document.getElementById('middleName');
    let lastNameInput = document.getElementById('lastName');
    let department = document.getElementById('departmentList');
    let display = document.getElementById('display');
    let tableList = document.getElementById('tableList');
    let names = [];
    let matricNumbers = [];
    let departments = [];
    let totalStudents = 0;

    function generateMatric() {
        let fName = firstNameInput.value;
        let mName = middleNameInput.value;
        let lName = lastNameInput.value;
        let fullName = `${fName} ${mName} ${lName}`;
        let dept = department.value;
        let prefix = "";

        if (dept === "SES") {
            prefix = "SES20260";
        } else if (dept === "GDS") {
            prefix = "GDS20260";
        } else if (dept === "UIUXS") {
            prefix = "UIUX20260";
        } else if (dept === "DS") {
            prefix = "DS20260";
        }

        if (fName === "" || lName === "" || dept === "") {
            display.innerHTML = `<p class="text-danger">Please enter your first and last name and select a department</p>`;
        } else if (names.includes(fullName)) {
            display.innerHTML = `<p class="text-danger">Student <strong>${fullName}</strong> already exists!</p>`;
        } else {
            totalStudents++;
            let currentCount = totalStudents;

            let matricNumber = prefix + 0 + currentCount;
            names.push(fullName);
            matricNumbers.push(matricNumber);
            departments.push(dept);

            display.innerHTML = `<p class="text-success">Matric Number Allocated: <strong>${matricNumber}</strong></p>`;

            showTable();
        }
    }

    // function removeStudent(val){
    //     matricNumbers = [...names.slice(val + 1), ...matricNumbers.splice(val + 1), ...departments.slice(val + 1)]
    //     // showTable()
    // }

    function removeStudent(index) {
        names.splice(index, 1);
        matricNumbers.splice(index, 1);
        departments.splice(index, 1);
        showTable();
    }

    function showTable() {
        let tableHTML = `<table class="table table-bordered table-striped mt-4">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Matric Number</th>
                                    <th>Department</th>
                                   <!-- <th>Action</th> -->
                                </tr>
                            </thead>
                            <tbody>`;

        for (let i = 0; i < names.length; i++) {
            tableHTML += `<tr>
                            <td>${names[i]}</td>
                            <td>${matricNumbers[i]}</td>
                            <td>${departments[i]}</td>
                             <td><button class="btn btn-danger btn-sm" onclick="removeStudent(${i})">Delete</button></td> 
                          </tr>`;
        }

        tableHTML += `</tbody></table>`;
        tableList.innerHTML = tableHTML;
    }
</script>
</html>
