<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            animation: slideIn 0.6s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-label {
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
        }
        .input-group-text {
            background-color: #fff;
            border-right: none;
            border-radius: 10px 0 0 10px;
            color: #764ba2;
            border-color: #ced4da;
        }
        .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
            padding: 12px;
            border-color: #ced4da;
            transition: all 0.3s;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #764ba2;
        }
        .input-group:focus-within .input-group-text {
            border-color: #764ba2;
        }
        .validation-msg {
            font-size: 0.85rem;
            min-height: 24px;
            margin-top: 4px;
            font-weight: 500;
        }
        .btn-submit {
            background: linear-gradient(to right, #667eea, #764ba2);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-dark">Create Account</h3>
                        <p class="text-muted">Enter your details to get started</p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            <input type="text" class="form-control" placeholder="John Doe" id="nameInput" onkeyup="nameProve(event)">
                        </div>
                        <div id="dlpNameInfo" class="validation-msg text-danger"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                            <input type="email" class="form-control" placeholder="name@example.com" id="mailInput" onkeyup="mailProve(event)">
                        </div>
                        <div id="dlpEmailInfo" class="validation-msg text-danger"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>
                            <input type="tel" class="form-control" placeholder="+234..." id="phoneInput" onkeyup="phoneProve(event)">
                        </div>
                        <div id="dlpPhoneInfo" class="validation-msg text-danger"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" placeholder="••••••••" id="passwordInput" onkeyup="passwordProve(event)">
                        </div>
                        <div id="dlpPasswordInfo" class="validation-msg text-danger"></div>
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-primary btn-submit text-white">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
