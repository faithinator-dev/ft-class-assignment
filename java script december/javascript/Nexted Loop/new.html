<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        function check(){
            console.log("Hello, World!");
        } //function in a long form

        const checkagain = () => {
            console.log("Hello, World!");
        };  //function in a short form (arrow function)
        checkagain(); //function call
    </script>
</body>
</html>
