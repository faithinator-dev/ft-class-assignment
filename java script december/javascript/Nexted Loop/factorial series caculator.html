<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial Calculator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm" style="max-width: 500px; margin: auto;">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Factorial Series Calculator</h4>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="numberInput" class="form-label">Enter a number:</label>
                    <input type="number" id="numberInput" class="form-control" placeholder="e.g. 5">
                </div>
                <button onclick="calculate()" class="btn btn-primary w-100">Calculate</button>
                
                <div class="mt-4">
                    <h5>Results:</h5>
                    <ul id="resultList" class="list-group"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const input = numberInput.value;
            const collect = Number(input);
            resultList.innerHTML = "";
            for(let i=1; i<=collect; i++){
                let result = 1;
                for(let j=1; j<=i; j++){
                    result = j;
                }
                
                // Display in UI
                const li = dozcument.createElement('li');
                li.className = 'list-group-item';
                li.textContent = "Factorial of " + i + " is: " + result;
                resultList.appendChild(li);
                
                console.log("Factorial of " + i + " is: " + result);
            }
        }

        /*
        collect = prompt("Enter a number to find its factorial:");

            let  j;
            result = 1;
            for(let j=1; j<=i; j++){
                result *= j;
            }
            console.log("Factorial of " + i + " is: " + result);
        }
        */
    </script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
