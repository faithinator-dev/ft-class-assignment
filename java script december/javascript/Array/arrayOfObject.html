<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body class="container">
    <!--- Create a form to add product - name, price, description-->
    <!-- <form action="" method="" class="m"> -->
    <div class="mb-3 mx-auto row" >
        <label for="" class="form-labe  col-5">Product Name</label>
        <input type="text"class="form-control mx-auto col-lg-5" name="" id="names" aria-describedby="helpId" placeholder="Enter a name" />

         <label for="" class="form-label">Description</label>
        <textarea type="text" class="form-control col-5" name="" id="description" aria-describedby="helpId" placeholder="Enter a description" required></textarea>

         <label for="" class="form-label">Price</label>
        <input type="number"class="form-control mb-4 col-5" name="" id="price" aria-describedby="helpId" placeholder="2000" />

        <button type="button" class="btn btn-dark" onclick="addProduct()" id="btn1">Add product</button>

        <input type="text" class="form-control py-3" placeholder="Search For a Product...." onkeypress="searchProduct(event)">

        <!-- <small id="helpId" class="form-text text-muted">Help text</small> -->
    </div>

    
    
    <div id="productsDiv" class="mx-2 my-4 gap-2 justify-content-center row d-flex"></div>
    <script src="arrayOfObject.js"></script>
</body>
