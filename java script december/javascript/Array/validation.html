<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow mx-auto" style="max-width: 600px;">
            <div class="card-header bg-dark text-white text-center py-3">
                <h3 class="mb-0">Validation Checker</h3>
            </div>
            <div class="card-body p-4">
                
                <!-- Beautiful Input -->
                <div class="form-floating mb-4">
                    <input type="text" class="form-control" id="validationInput" placeholder="Enter text here">
                    <label for="validationInput">Enter text to validate...</label>
                </div>

                <!-- Display Area -->
                <div id="displayArea" class="alert alert-secondary text-center mb-4" role="alert" style="min-height: 60px; display: flex; align-items: center; justify-content: center;">
                    <span class="text-muted fst-italic">Results will be displayed here</span>
                </div>

                <!-- Action Buttons -->
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" type="button" onclick="checkSpace()">Check For Space</button>
                    <button class="btn btn-success" type="button" onclick="checkDigits()">Check For Digits</button>
                    <button class="btn btn-warning text-dark" type="button" onclick="checkHyphenUnderscore()">Check For Hyphens and Underscore</button>
                    <button class="btn btn-dark" type="button" onclick="checkLength()">Check For Length</button>
                    <button class="btn btn-info" type="button" onclick="checkAlphabetNumber()">Check For Alphabet and Number</button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const input = document.getElementById('validationInput');
        const display = document.getElementById('displayArea');

        // Helper function to update the display color and text
        function updateDisplay(message, isMatch) {
            display.innerText = message;
            if (isMatch) {
                display.className = "alert alert-success text-center mb-4 fw-bold";
            } else {
                display.className = "alert alert-danger text-center mb-4 fw-bold";
            }
        }

        function checkSpace() {
            // \s matches any whitespace character (space, tab, etc.)
            const regex = /\s/;
            const isMatch = regex.test(input.value);
            if (isMatch) {
                updateDisplay("Space Found! ✅", isMatch);
            } else {
                updateDisplay("No Space Found ❌", isMatch);
            }
        }

        function checkDigits() {
            // \d matches any digit (0-9)
            const regex = /\d/;
            const isMatch = regex.test(input.value);
            if (isMatch) {
                updateDisplay("Digit Found! ✅", isMatch);
            } else {
                updateDisplay("No Digit Found ❌", isMatch);
            }
        }

        function checkHyphenUnderscore() {
            // [-] matches a hyphen, [_] matches an underscore
            const regex = /[-_]/;
            const isMatch = regex.test(input.value);
            if (isMatch) {
                updateDisplay("Hyphen or Underscore Found! ✅", isMatch);
            } else {
                updateDisplay("None Found ❌", isMatch);
            }
        }

        function checkLength() {
            // ^.{8,}$ matches any character (.) 8 or more times ({8,})
            const regex = /^.{8,}$/; 
            const isMatch = regex.test(input.value);
            if (isMatch) {
                updateDisplay("Length is Valid (8+ chars) ✅", isMatch);
            } else {
                updateDisplay("Too Short (Need 8+ chars) ❌", isMatch);
            }
        }

        function checkAlphabetNumber() {
            // [a-zA-Z0-9] matches any letter or number
            const regex = /[a-zA-Z0-9]/;
            // const regex = /[\d\w]/;
            const isMatch = regex.test(input.value);
            if (isMatch) {
                updateDisplay("Alphabet and Number Found! ✅", isMatch);
            } else {
                updateDisplay("No Alphabet or Number Found ❌", isMatch);
            }
        }

        /* 
           === GUIDE: How to use Ternary Operators ===
           A ternary operator is a shorter way to write an if-else statement.
           
           Syntax: condition ? value_if_true : value_if_false
           
           Example for checkSpace():
           
           // instead of the if-else block above, you can just write:
           // updateDisplay(isMatch ? "Space Found! ✅" : "No Space Found ❌", isMatch);
        */
    </script>
</body>
</html>
