        alert("Please enter a todo")

        return
      } else {
        console.log(todoValue)
        console.log("button is working")
         const todoObj = {

            time: new Date().toLocaleTimeString(),

         }
         console.log(todoObj)
         const db = getDatabase();
        const dbref = ref(db, 'todos/0')
        set(dbref, todoObj)
