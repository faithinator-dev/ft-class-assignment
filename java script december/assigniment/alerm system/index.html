<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarm System</title>
    <style>
        body{
            max-width: 100vw;
            max-height: 100vh;
            height: 100vh;
            margin: 0;
            border: 0;
            outline: 0;
            padding: 10px;
            background-image: linear-gradient(45deg, cadetblue, blue);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            background-color: rgb(255, 255, 255) ;
            width: 50rem;
            height: 25rem;
            color: rgb(1, 1, 53);
            border-radius: 10px;
            align-content: center;
            justify-items: center;
            text-align: center;
            position: absolute;
            z-index: 2;
        }

        .time{
            /* background-color: rgb(20, 0, 26 ); */
            background-image: linear-gradient(135deg, rgb(255, 255, 255), rgb(225, 221, 221), white,  rgb(225, 221, 221), white);
            /* background-color: rgb(192, 192, 192, 0.2); */
            /* background-blend-mode: darken; */
            /* mix-blend-mode: ; */
            color: rgb(14, 37, 16);
            text-shadow: 2px 2px 3px black;
            padding: 2rem;
            width: 11rem;
            font-size: xx-large;
            font-weight: 700;
            border: 1px solid silver;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            /* padding: 10px; */
            /* padding-left: 3rem; */
            /* padding-top: 2rem; */
            border-radius: 30px;
            
        }

        .container2{
            background-color: rgb(255, 255, 255) ;
            width: 50rem;
            height: 25rem;
            color: rgb(1, 1, 53);
            border-radius: 10px;
            align-content: center;
            justify-items: center;
            text-align: center;
            position: absolute;
            z-index: 1;
        }

        .alarm-btn{
            padding: 10px;
            width: 10rem;
            margin: 10px;
            color: aliceblue;
            background-color: rgb(154, 154, 158);
            font-size: larger;
            border-radius: 50px;
            cursor: pointer;
        }

        .alarm-btn:hover{
            color: black;
            background-color: aliceblue;
        }

    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="time">
            <span class="numTime" id="hour">10</span> : <span class="numTime" id="minute">11</span> : <span class="numTime" id="second">50</span>
        </div>
        <button class="alarm-btn" onclick="dispalarm()">Set Alarm</button>
    </div>
    <div class="container2" id="container2">

    </div>

    
</body>

<script>
    const time = () => {
        const hr = document.getElementById("hour")
        const min = document.getElementById("minute")
        const second = document.getElementById("second")
        const today = new Date
        
        hr.innerText = today.getHours()
        min.innerText = today.getMinutes()
        second.innerText = today.getSeconds()
    }

    setInterval(() => {
        time()
    }, 1000)

    const dispalarm = () => {
        const TimeContainer = document.getElementById(container)
        const alarmContainer = document.getElementById(container2)

        TimeContainer.style.zIndex = "1"
        alarmContainer.style.zIndex = "2"
    }
</script>
</html>
